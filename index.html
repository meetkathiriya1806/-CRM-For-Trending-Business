<script>
'use strict';
const KEY='shingTelBusiness_v1';
const blank=()=>({customers:[],suppliers:[],vendors:[],purchases:[],sales:[],vendorSales:[],customerPayments:[],supplierPayments:[],vendorPayments:[],expenses:[],stockMoves:[],finance:[],meta:{version:1,stockUnit:'oilcan'}});
let db=blank();

async function load() {
    try {
        const client = window.sbClient;
        const [
            { data: customers },
            { data: suppliers },
            { data: vendors },
            { data: purchases },
            { data: sales },
            { data: customerPayments },
            { data: vendorSales },
            { data: vendorPayments },
            { data: supplierPayments },
            { data: expenses },
            { data: stockMoves },
            { data: finance }
        ] = await Promise.all([
            client.from('customers').select('*'),
            client.from('suppliers').select('*'),
            client.from('vendors').select('*'),
            client.from('purchases').select('*'),
            client.from('sales').select('*'),
            client.from('customer_payments').select('*'),
            client.from('vendor_sales').select('*'),
            client.from('vendor_payments').select('*'),
            client.from('supplier_payments').select('*'),
            client.from('expenses').select('*'),
            client.from('stock_moves').select('*'),
            client.from('finance').select('*')
        ]);

        const local = JSON.parse(localStorage.getItem(KEY)) || {};

        return {
            ...blank(),
            customers: customers?.length ? customers : (local.customers || []),
            suppliers: suppliers?.length ? suppliers : (local.suppliers || []),
            vendors: vendors?.length ? vendors : (local.vendors || []),
            purchases: (purchases?.length ? purchases : (local.purchases || [])).map(p => ({
                ...p,
                supplierId: p.supplier_id || p.supplierId,
                initialPaid: Number(p.initial_paid ?? p.initialPaid ?? 0)
            })),
            sales: (sales?.length ? sales : (local.sales || [])).map(s => ({
                ...s,
                customerId: s.customer_id || s.customerId,
                initialPaid: Number(s.initial_paid ?? s.initialPaid ?? 0),
                unitCost: Number(s.unit_cost ?? s.unitCost ?? 0)
            })),
            customerPayments: (customerPayments?.length ? customerPayments : (local.customerPayments || [])).map(cp => ({
                ...cp,
                customerId: cp.customer_id || cp.customerId,
                saleId: cp.sale_id || cp.saleId
            })),
            vendorSales: (vendorSales?.length ? vendorSales : (local.vendorSales || [])).map(vs => ({
                ...vs,
                vendorId: vs.vendor_id || vs.vendorId,
                initialPaid: Number(vs.initial_paid ?? vs.initialPaid ?? 0)
            })),
            vendorPayments: (vendorPayments?.length ? vendorPayments : (local.vendorPayments || [])).map(vp => ({
                ...vp,
                vendorId: vp.vendor_id || vp.vendorId
            })),
            supplierPayments: (supplierPayments?.length ? supplierPayments : (local.supplierPayments || [])).map(sp => ({
                ...sp,
                supplierId: sp.supplier_id || sp.supplierId,
                purchaseId: sp.purchase_id || sp.purchaseId
            })),
            expenses: expenses?.length ? expenses : (local.expenses || []),
            stockMoves: (stockMoves?.length ? stockMoves : (local.stockMoves || [])).map(sm => ({
                ...sm,
                in: Number(sm.in_qty ?? sm.in ?? 0),
                out: Number(sm.out_qty ?? sm.out ?? 0)
            })),
            finance: finance?.length ? finance : (local.finance || [])
        };
    } catch (e) {
        console.error('Data load error:', e);
        try { return JSON.parse(localStorage.getItem(KEY)) || blank(); } catch(err) { return blank(); }
    }
}

function save() {
    localStorage.setItem(KEY, JSON.stringify(db));
    syncToSupabase();
}

async function syncToSupabase() {
    try {
        const client = window.sbClient;
        if (db.customers.length) await client.from('customers').upsert(db.customers);
        if (db.suppliers.length) await client.from('suppliers').upsert(db.suppliers);
        if (db.vendors.length) await client.from('vendors').upsert(db.vendors);
        
        if (db.purchases.length) {
            const mappedPurchases = db.purchases.map(p => ({
                id: p.id, date: p.date, supplier_id: p.supplierId, bill: p.bill,
                order_no: p.orderNo, oilcan: p.oilcan, litres: p.litres, rate: p.rate,
                transport: p.transport, other: p.other, total: p.total,
                initial_paid: p.initialPaid, method: p.method, notes: p.notes, created: p.created
            }));
            await client.from('purchases').upsert(mappedPurchases);
        }

        if (db.sales.length) {
            const mappedSales = db.sales.map(s => ({
                id: s.id, date: s.date, customer_id: s.customerId, product: s.product,
                qty: s.qty, litres: s.litres, rate: s.rate, total: s.total,
                initial_paid: s.initialPaid, method: s.method, notes: s.notes,
                unit_cost: s.unitCost, created: s.created
            }));
            await client.from('sales').upsert(mappedSales);
        }

        if (db.expenses.length) await client.from('expenses').upsert(db.expenses);
    } catch (err) {
        console.error('Supabase Sync Error:', err);
    }
}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:0});
const num=n=>(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const displayDate=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB'):'—';
const id=prefix=>prefix+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
const sum=(a,f)=>a.reduce((t,x)=>t+(f?Number(f(x))||0:Number(x)||0),0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function opt(items,selected='',placeholder='Select...'){return `<option value="">${placeholder}</option>`+items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}
function field(label,name,type='text',value='',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,name,options,extra=''){return `<div class="field"><label>${label}</label><select name="${name}" ${extra}>${options}</select></div>`}
function area(label,name,value=''){return `<div class="field wide"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`}
function formModal(title,inner,onSubmit){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=`<form id="entryForm">${inner}<div class="form-actions"><button type="button" class="btn" id="cancelForm">Cancel</button><button class="btn primary" type="submit">Save Entry</button></div></form>`;$('#modal').classList.add('show');$('#cancelForm').onclick=closeModal;const qtyInput=$('#entryForm [name=qty]'),rateInput=$('#entryForm [name=rate]'),paidInput=$('#entryForm [name=paid]'),totalOutput=$('#entryForm [name=calculatedTotal]'),dueOutput=$('#entryForm [name=calculatedDue]');if(qtyInput&&rateInput&&totalOutput){const updateSaleTotal=()=>{const total=(Number(qtyInput.value)||0)*(Number(rateInput.value)||0),paid=Number(paidInput?.value)||0;totalOutput.value=money(total);if(dueOutput)dueOutput.value=money(total-paid)};[qtyInput,rateInput,paidInput].filter(Boolean).forEach(el=>el.addEventListener('input',updateSaleTotal));updateSaleTotal()}let cs=$('#saleCustomerSearch');if(cs)cs.onchange=()=>{let v=cs.value.trim();let c=db.customers.find(x=>(x.name+' — '+(x.phone||'')).toLowerCase()===v.toLowerCase()||x.name.toLowerCase()===v.toLowerCase());$('#saleCustomerId').value=c?c.id:'';};$('#entryForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());try{onSubmit(data);closeModal();save();render();toast('Entry saved successfully')}catch(err){toast(err.message||'Unable to save entry')}}}
function closeModal(){$('#modal').classList.remove('show')}
$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function addFinance(type,amount,method,date,ref,description){if(!(Number(amount)>0))return;db.finance.push({id:id('FIN'),type,amount:Number(amount),method:method||'Cash',date,ref,description})}
function stockNow(){return sum(db.stockMoves,x=>x.in)-sum(db.stockMoves,x=>x.out)}
function stockCost(){let q=0,avg=0;const moves=[...db.stockMoves].sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));for(const m of moves){if(m.type==='Purchase'){const p=db.purchases.find(x=>x.id===m.ref);if(p&&m.in>0){avg=(q*avg+p.total)/(q+m.in);q+=m.in}}else if(m.out>0){q=Math.max(0,q-m.out)}else if(m.in>0){q+=m.in}}return avg}
function stockValue(){return Math.max(0,stockNow())*stockCost()}
function cPaid(saleId){return sum(db.customerPayments.filter(p=>p.saleId===saleId),p=>p.amount)+Number(db.sales.find(s=>s.id===saleId)?.initialPaid||0)}
function vPaid(saleId){return sum(db.vendorPayments.filter(p=>p.saleId===saleId),p=>p.amount)+Number(db.vendorSales.find(s=>s.id===saleId)?.initialPaid||0)}
function supplierPaid(purchaseId){return sum(db.supplierPayments.filter(p=>p.purchaseId===purchaseId),p=>p.amount)+Number(db.purchases.find(p=>p.id===purchaseId)?.initialPaid||0)}
function customerDue(custId){return sum(db.sales.filter(s=>s.customerId===custId),s=>s.total)-sum(db.customerPayments.filter(p=>p.customerId===custId),p=>p.amount)-sum(db.sales.filter(s=>s.customerId===custId),s=>s.initialPaid)}
function supplierDue(supId){return sum(db.purchases.filter(p=>p.supplierId===supId),p=>p.total)-sum(db.supplierPayments.filter(p=>p.supplierId===supId),p=>p.amount)-sum(db.purchases.filter(p=>p.supplierId===supId),p=>p.initialPaid)}
function vendorDue(vId){return sum(db.vendorSales.filter(s=>s.vendorId===vId),s=>s.total)-sum(db.vendorPayments.filter(p=>p.vendorId===vId),p=>p.amount)-sum(db.vendorSales.filter(s=>s.vendorId===vId),s=>s.initialPaid)}
function nameOf(list,idv){return list.find(x=>x.id===idv)?.name||'—'}
function rangeDates(range='month'){let d=new Date(),start=new Date(d),end=new Date(d);if(range==='today'){}else if(range==='week'){start.setDate(d.getDate()-d.getDay())}else if(range==='month'){start.setDate(1)}else if(range==='year'){start.setMonth(0,1)}return [start.toISOString().slice(0,10),end.toISOString().slice(0,10)]}
function within(date,a,b){return date>=a&&date<=b}
function metric(label,value,sub=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-sub">${sub}</div></div>`}
function pageHead(title,desc,button=''){return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div>${button}</div>`}
function table(headers,rows,empty='No records found'){const labels=headers.map(h=>String(h).replace(/<[^>]*>/g,'').trim());const mobileRows=rows.map(row=>{let i=0;return row.replace(/<td(?![^>]*colspan)/g,match=>{const label=labels[i++]||'';return match+` data-label="${esc(label)}"`})});return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?mobileRows.join(''):`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function tr(cells){return `<tr>${cells.map(c=>`<td>${c??''}</td>`).join('')}</tr>`}
let selectedFrom=rangeDates('month')[0], selectedTo=today();
function dateFilterHtml(){return `<div class="filterbar" style="margin-bottom:15px"><div class="field"><label>From</label><input type="date" id="filterFrom" value="${selectedFrom}"></div><div class="field"><label>To</label><input type="date" id="filterTo" value="${selectedTo}"></div><button class="btn primary" id="applyFilter">Apply Filter</button><button class="btn" id="thisMonth">This Month</button></div>`}
let active='dashboard';
function render(){const titles={dashboard:'Dashboard',purchases:'Purchase Management',inventory:'Stock & Inventory',customers:'Customer Management',sales:'Sales Management',customerDue:'Customer Due Payments',vendors:'Vendor Oilcan Sales',finance:'Finance Management',expenses:'Expense Management',reports:'KrushiFal Shing Tel Reports',backup:'Data Backup & Restore'};$('#topTitle').textContent=titles[active];$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===active));let fn=pages[active];$('#content').innerHTML=fn();bindCommon()}
function bindCommon(){let a=$('#applyFilter');if(a)a.onclick=()=>{selectedFrom=$('#filterFrom').value;selectedTo=$('#filterTo').value;if(selectedFrom>selectedTo){toast('From date must be before To date');return}render();bindPageExtras()};let b=$('#thisMonth');if(b)b.onclick=()=>{selectedFrom=rangeDates('month')[0];selectedTo=today();render();bindPageExtras()};$$('[data-delete]').forEach(b=>b.onclick=()=>{let [type,rid]=b.dataset.delete.split('|');deleteRecord(type,rid)});$$('[data-edit]').forEach(b=>b.onclick=()=>{let [type,rid]=b.dataset.edit.split('|');editRecord(type,rid)});$$('[data-bill]').forEach(b=>b.onclick=()=>makeBill(b.dataset.bill,true));$$('[data-wa-bill]').forEach(b=>b.onclick=()=>sendBillWhatsApp(b.dataset.waBill));$$('[data-profile]').forEach(b=>b.onclick=()=>profile(b.dataset.profile,b.dataset.id))}
function getRange(){return [selectedFrom,selectedTo]}
const pages={
dashboard:()=>{return pageHead('Business Overview','Live summary calculated from saved transactions')+dateFilterHtml()+dashboardBody(selectedFrom,selectedTo)},
purchases:()=>pageHead('Purchase Management','Record purchases from manufacturers and supplier payments',`<button class="btn" id="paySupplier">＋ Pay Supplier</button> <button class="btn primary" id="newPurchase">＋ Add Purchase</button>`)+purchaseBody(),
inventory:()=>pageHead('Stock & Inventory','Inventory is managed and displayed in Oilcan; each Oilcan contains 15 litres')+inventoryBody(),
customers:()=>pageHead('Customers','Maintain individual customer accounts',`<button class="btn primary" id="newCustomer">＋ Add Customer</button>`)+customerBody(),
sales:()=>pageHead('Sales Management','Record 15-litre Oilcan sales only',`<button class="btn primary" id="newSale">＋ New Sale</button>`)+salesBody(),
customerDue:()=>pageHead('Customer Due Payments','Record partial and subsequent payments against a sale',`<button class="btn primary" id="newCustomerPayment">＋ Receive Payment</button>`)+dueBody(),
vendors:()=>pageHead('Vendor Oilcan Sales','Separate vendor accounts; fixed profit is ₹50 per Oilcan',`<button class="btn" id="newVendor">＋ Add Vendor</button> <button class="btn primary" id="newVendorSale">＋ Vendor Sale</button> <button class="btn" id="newVendorPayment">＋ Receive Payment</button>`)+vendorBody(),
finance:()=>pageHead('Finance Management','Cash, bank and UPI movement from recorded transactions')+financeBody(),
expenses:()=>pageHead('Expense Management','Record business expenses and payment methods',`<button class="btn primary" id="newExpense">＋ Add Expense</button>`)+expenseBody(),
reports:()=>pageHead('Reports','Filter, review and export business records')+reportsBody(),
backup:()=>pageHead('Data Backup & Restore','Protect your local business data with JSON backups and CSV exports')+backupBody()
};
function dashboardBody(a,b){let f=selectedFrom||a,t=selectedTo||b;let sales=db.sales.filter(x=>within(x.date,f,t)),purchases=db.purchases.filter(x=>within(x.date,f,t)),exp=db.expenses.filter(x=>within(x.date,f,t));let rev=sum(sales,x=>x.total),received=sum(db.customerPayments.filter(x=>within(x.date,f,t)),x=>x.amount)+sum(sales,x=>x.initialPaid),purchase=sum(purchases,x=>x.total),vendorD=db.vendorSales.filter(x=>within(x.date,f,t)),vOilcan=sum(vendorD,x=>x.oilcan),vProfit=vOilcan*50;let due=sum(db.sales,x=>x.total)-sum(db.customerPayments,x=>x.amount)-sum(db.sales,x=>x.initialPaid);let sDue=sum(db.purchases,x=>x.total)-sum(db.supplierPayments,x=>x.amount)-sum(db.purchases,x=>x.initialPaid);let vendorOutstanding=sum(db.vendorSales,x=>x.total)-sum(db.vendorPayments,x=>x.amount)-sum(db.vendorSales,x=>x.initialPaid);let cost=sales.reduce((z,x)=>z+(x.litres/15)*x.unitCost,0);let gross=rev-cost;let expenses=sum(exp,x=>x.amount);let net=gross+vProfit-expenses;return `<div class="grid">${metric('Purchase Amount',money(purchase),'Selected period')}${metric('Sales Amount',money(rev),'Regular customer sales')}${metric('Customer Payments',money(received),'Selected period')}${metric('Customer Outstanding',money(due),'All-time balance')}${metric('Supplier Outstanding',money(sDue),'All-time balance')}${metric('Total Expenses',money(expenses),'Selected period')}${metric('Available Stock',num(stockNow())+' Oilcan','Available inventory')}${metric('Stock Value',money(stockValue()),'Weighted average cost')}${metric('Total Oilcan Sold',num(sum(sales.filter(x=>x.product==='oilcan'),x=>x.qty)+vOilcan),'Includes vendor Oilcan')}${metric('Vendor Oilcan Sales',num(vOilcan),'Selected period')}${metric('Vendor Profit',money(vProfit),'₹50 × vendor Oilcan')}${metric('Business Net Profit',money(net),'Gross profit + vendor profit − expenses')}</div><div class="two-col"><div class="card"><h3 class="section-title">Sales & Purchase Overview</h3><div class="summary-row"><span>Customer sales revenue</span><b>${money(rev)}</b></div><div class="summary-row"><span>Purchase value</span><b>${money(purchase)}</b></div><div class="summary-row"><span>Cost of goods sold (customer sales)</span><b>${money(cost)}</b></div><div class="summary-row"><span>Gross profit</span><b class="${gross>=0?'positive':'negative'}">${money(gross)}</b></div><div class="summary-row"><span>Vendor fixed profit</span><b>${money(vProfit)}</b></div><div class="summary-row"><span>Expenses</span><b>${money(expenses)}</b></div><div class="summary-row"><b>Net profit</b><b class="${net>=0?'positive':'negative'}">${money(net)}</b></div><p class="hint">Profit uses weighted-average purchase cost. Vendor profit is kept separate and added once. Payments affect cash balances, not profit.</p></div><div class="card"><h3 class="section-title">Outstanding Payments</h3><div class="summary-row"><span>Customer receivables</span><b>${money(due)}</b></div><div class="summary-row"><span>Vendor receivables</span><b>${money(vendorOutstanding)}</b></div><div class="summary-row"><span>Supplier payables</span><b>${money(sDue)}</b></div><h3 class="section-title" style="margin-top:18px">Current Stock</h3><div class="statline"><div class="statbox"><b>${num(stockNow())}</b><span>Available Oilcan</span></div><div class="statbox"><b>${num(stockNow())}</b><span>Oilcan</span></div><div class="statbox"><b>${money(stockValue())}</b><span>Stock value</span></div></div></div></div>`}
function purchaseBody(){let rows=db.purchases.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>tr([displayDate(p.date),esc(p.bill||'—'),esc(nameOf(db.suppliers,p.supplierId)),num(p.oilcan)+' Oilcan',money(p.total),money(supplierPaid(p.id)),`<b>${money(p.total-supplierPaid(p.id))}</b>`,`<div class="actions"><button class="btn small" data-edit="purchases|${p.id}">Edit</button><button class="btn small danger" data-delete="purchases|${p.id}">Delete</button></div>`]));return `<div class="grid">${metric('Total Purchases',money(sum(db.purchases,x=>x.total)))}${metric('Supplier Due',money(sum(db.purchases,x=>x.total)-sum(db.supplierPayments,x=>x.amount)-sum(db.purchases,x=>x.initialPaid)))}${metric('Stock Received',num(sum(db.purchases,x=>x.oilcan))+' Oilcan')}${metric('Purchase Records',db.purchases.length)}</div><div class="toolbar"><input id="purchaseSearch" placeholder="Search supplier or bill number"><button class="btn" id="exportPurchases">Export CSV</button></div><div id="purchaseTable">${table(['Date','Bill No.','Supplier','Quantity','Total Amount','Paid','Remaining Due','Actions'],rows)}</div>`}
function inventoryBody(){let rows=db.stockMoves.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).map(m=>tr([displayDate(m.date),esc(m.type),esc(m.ref),m.in?num(m.in)+' Oilcan':'—',m.out?num(m.out)+' Oilcan':'—',num(m.balance)+' Oilcan',esc(m.description)]));return `<div class="grid">${metric('Total Stock Purchased',num(sum(db.stockMoves,x=>x.in))+' Oilcan')}${metric('Total Stock Sold',num(sum(db.stockMoves,x=>x.out))+' Oilcan')}${metric('Available Stock',num(stockNow())+' Oilcan','Available inventory')}${metric('Stock Value',money(stockValue()),'Weighted-average valuation')}</div><div class="card" style="margin-bottom:15px"><h3 class="section-title">Stock Adjustment</h3><p class="hint">Adjustments are recorded permanently in stock movement history. Use only for a verified physical stock correction.</p><button class="btn primary" id="stockAdjust">＋ Record Stock Adjustment</button></div>${table(['Date','Type','Reference','Stock In','Stock Out','Balance','Description'],rows)}`}
function customerBody(){let q=$('#customerSearch')?.value?.toLowerCase()||'';let list=db.customers.filter(c=>(c.name+' '+c.phone+' '+c.reference).toLowerCase().includes(q));let rows=list.map(c=>tr([`<a href="#" data-profile="customer" data-id="${c.id}">${esc(c.name)}</a>`,esc(c.phone||'—'),esc(c.reference||'—'),money(sum(db.sales.filter(s=>s.customerId===c.id),s=>s.total)),money(sum(db.sales.filter(s=>s.customerId===c.id),s=>s.initialPaid)+sum(db.customerPayments.filter(p=>p.customerId===c.id),p=>p.amount)),`<b>${money(customerDue(c.id))}</b>`,`<div class="actions"><button class="btn small" data-profile="customer" data-id="${c.id}">View</button><button class="btn small" data-edit="customers|${c.id}">Edit</button><button class="btn small danger" data-delete="customers|${c.id}">Delete</button></div>`]));return `<div class="toolbar"><input id="customerSearch" placeholder="Search name, phone or reference" value="${esc(q)}"><button class="btn" id="exportCustomers">Export CSV</button></div>${table(['Customer','Phone','Reference','Total Sales','Received','Outstanding','Actions'],rows)}`}
function salesBody(){let rows=db.sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>tr([displayDate(s.date),esc(s.id),esc(nameOf(db.customers,s.customerId)),s.product==='loose'?'Legacy Sale':'15-Litre Oilcan',num(s.qty)+' Oilcan',money(s.total),money(cPaid(s.id)),`<b>${money(s.total-cPaid(s.id))}</b>`,`<div class="actions"><button class="btn small" data-bill="${s.id}">PDF Bill</button><button class="btn small" data-wa-bill="${s.id}">WhatsApp</button><button class="btn small" data-edit="sales|${s.id}">Edit</button><button class="btn small danger" data-delete="sales|${s.id}">Delete</button></div>`]));return `<div class="grid">${metric('Total Sales',money(sum(db.sales,x=>x.total)))}${metric('Customer Outstanding',money(sum(db.sales,x=>x.total)-sum(db.sales,x=>x.initialPaid)-sum(db.customerPayments,x=>x.amount)))}${metric('Customer Oilcan Sold',num(sum(db.sales.filter(x=>x.product==='oilcan'),x=>x.qty)))}</div><div class="toolbar"><input id="salesSearch" placeholder="Search customer or invoice"><button class="btn" id="exportSales">Export CSV</button></div>${table(['Date','Invoice','Customer','Product','Quantity','Amount','Received','Due','Actions'],rows)}`}
function dueBody(){let rows=db.sales.filter(s=>s.total-cPaid(s.id)>.009).map(s=>tr([displayDate(s.date),esc(s.id),esc(nameOf(db.customers,s.customerId)),money(s.total),money(cPaid(s.id)),`<b class="negative">${money(s.total-cPaid(s.id))}</b>`,`<button class="btn small" data-pay-sale="${s.id}">Receive</button>`]));let history=db.customerPayments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>tr([displayDate(p.date),esc(p.id),esc(nameOf(db.customers,p.customerId)),esc(p.saleId),money(p.amount),esc(p.method),esc(p.reference||'—'),`<button class="btn small danger" data-delete="customerPayments|${p.id}">Delete</button>`]));return `<div class="grid">${metric('Total Receivables',money(sum(db.sales,x=>x.total)-sum(db.sales,x=>x.initialPaid)-sum(db.customerPayments,x=>x.amount)))}${metric('Payment Entries',db.customerPayments.length)}${metric('Customers With Due',db.customers.filter(c=>customerDue(c.id)>.009).length)}</div><h3 class="section-title">Outstanding Sales</h3>${table(['Sale Date','Invoice','Customer','Sale Amount','Received','Remaining Due',''],rows)}<h3 class="section-title" style="margin-top:20px">Payment History</h3>${table(['Payment Date','Payment ID','Customer','Sale Ref','Amount','Method','Reference','Actions'],history)}`}
function vendorBody(){let rows=db.vendors.map(v=>tr([esc(v.name),esc(v.phone||'—'),num(sum(db.vendorSales.filter(s=>s.vendorId===v.id),s=>s.oilcan)),money(sum(db.vendorSales.filter(s=>s.vendorId===v.id),s=>s.total)),money(sum(db.vendorSales.filter(s=>s.vendorId===v.id),s=>s.oilcan)*50),money(sum(db.vendorSales.filter(s=>s.vendorId===v.id),s=>s.initialPaid)+sum(db.vendorPayments.filter(p=>p.vendorId===v.id),p=>p.amount)),`<b>${money(vendorDue(v.id))}</b>`]));let hist=db.vendorSales.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(s=>tr([displayDate(s.date),esc(s.id),esc(nameOf(db.vendors,s.vendorId)),num(s.oilcan),money(s.rate),money(s.total),money(s.oilcan*50),`<div class="actions"><button class="btn small" data-edit="vendorSales|${s.id}">Edit</button><button class="btn small danger" data-delete="vendorSales|${s.id}">Delete</button></div>`]));return `<div class="grid">${metric('Total Vendor Oilcan',num(sum(db.vendorSales,x=>x.oilcan)))}${metric('Vendor Sales',money(sum(db.vendorSales,x=>x.total)))}${metric('Vendor Profit',money(sum(db.vendorSales,x=>x.oilcan)*50))}${metric('Vendor Outstanding',money(sum(db.vendorSales,x=>x.total)-sum(db.vendorSales,x=>x.initialPaid)-sum(db.vendorPayments,x=>x.amount)))}</div><h3 class="section-title">Vendor Accounts</h3>${table(['Vendor','Phone','Oilcan Sold','Sales Amount','Fixed Profit','Received','Outstanding'],rows)}<h3 class="section-title" style="margin-top:20px">Vendor Sales History</h3>${table(['Date','Sale Ref','Vendor','Oilcan','Rate / Oilcan','Total','Profit','Actions'],hist)}<h3 class="section-title" style="margin-top:20px">Vendor Payment History</h3>${table(['Date','Payment ID','Vendor','Amount','Method','Reference'],db.vendorPayments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>tr([displayDate(p.date),esc(p.id),esc(nameOf(db.vendors,p.vendorId)),money(p.amount),esc(p.method),esc(p.reference||'—')])))}`}
function financeBody(){let balances={Cash:0,'Bank Transfer':0,UPI:0,Other:0};db.finance.forEach(x=>{let m=x.method==='Bank'?'Bank Transfer':x.method;if(!(m in balances))m='Other';balances[m]+=(x.type==='in'?1:-1)*x.amount});let rows=db.finance.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>tr([displayDate(x.date),esc(x.type==='in'?'Receipt':'Payment'),esc(x.description),esc(x.ref),esc(x.method),money(x.amount),`<span class="${x.type==='in'?'positive':'negative'}">${x.type==='in'?'+':'−'}${money(x.amount)}</span>`]));return `<div class="grid">${metric('Cash Balance',money(balances.Cash))}${metric('Bank Balance',money(balances['Bank Transfer']))}${metric('UPI Balance',money(balances.UPI))}${metric('Total Recorded Balance',money(sum(Object.values(balances))))}</div>${table(['Date','Type','Description','Reference','Method','Amount','Movement'],rows)}`}
function expenseBody(){let rows=db.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>tr([displayDate(x.date),esc(x.category),esc(x.description),money(x.amount),esc(x.method),esc(x.notes||'—'),`<div class="actions"><button class="btn small" data-edit="expenses|${x.id}">Edit</button><button class="btn small danger" data-delete="expenses|${x.id}">Delete</button></div>`]));return `<div class="grid">${metric('Total Expenses',money(sum(db.expenses,x=>x.amount)))}${metric("Today's Expenses",money(sum(db.expenses.filter(x=>x.date===today()),x=>x.amount)))}${metric('This Month',money(sum(db.expenses.filter(x=>x.date.slice(0,7)===today().slice(0,7)),x=>x.amount)))}</div>${table(['Date','Category','Description','Amount','Method','Notes','Actions'],rows)}`}
function reportsBody(){return `${dateFilterHtml()}<div class="toolbar"><select id="reportType"><option value="sales">Sales</option><option value="purchases">Purchases</option><option value="customerPayments">Customer Payments</option><option value="vendorSales">Vendor Sales</option><option value="expenses">Expenses</option><option value="finance">Finance</option><option value="stockMoves">Stock Movement</option></select><button class="btn primary" id="runReport">Run Report</button><button class="btn" id="exportReport">Export CSV</button><button class="btn" id="exportAllExcel">Export All Data (Excel)</button></div><div id="reportResult" class="card"><p class="muted">Choose a report and date range, then select Run Report.</p></div><div class="notice" style="margin-top:15px">Profit methodology: weighted-average purchase cost is used for customer-sale COGS. Vendor profit is calculated separately at ₹50 per Oilcan and is not counted again in customer gross profit.</div>`}
function backupBody(){return `<div class="two-col"><div class="card"><h3 class="section-title">Full System Backup</h3><p class="muted">Download all saved business records, balances, stock movements and finance transactions in one JSON file.</p><button class="btn primary" id="backupDownload">Download JSON Backup</button> <button class="btn" id="exportAllExcel">Export All Data (Excel)</button><p class="hint">Keep a copy on another drive or computer. Browser data can be lost if browser storage is cleared.</p></div><div class="card"><h3 class="section-title">Restore Backup</h3><p class="muted">Restore a previously downloaded JSON backup. Existing records will be overwritten.</p><input type="file" id="restoreFile" accept=".json,application/json"><button class="btn danger" id="restoreBtn" style="margin-top:12px">Restore Data</button></div></div><div class="card" style="margin-top:15px"><h3 class="section-title">CSV Export</h3><p class="muted">Export individual tables for Excel.</p><div class="toolbar">${['customers','purchases','sales','customerPayments','vendorSales','vendorPayments','expenses','stockMoves','finance'].map(x=>`<button class="btn" data-csv="${x}">${x.replace(/[A-Z]/g,m=>' '+m).replace(/^./,m=>m.toUpperCase())}</button>`).join('')}</div></div><div class="notice" style="margin-top:15px">This application stores data in Supabase cloud database with local fallback cache.</div>`}
function profile(type,rid){if(type!=='customer')return;let c=db.customers.find(x=>x.id===rid);if(!c)return;let sales=db.sales.filter(x=>x.customerId===rid),pays=db.customerPayments.filter(x=>x.customerId===rid);formModal('Customer Account — '+c.name,`<div class="statline"><div class="statbox"><b>${money(sum(sales,x=>x.total))}</b><span>Total sales</span></div><div class="statbox"><b>${money(sum(sales,x=>x.initialPaid)+sum(pays,x=>x.amount))}</b><span>Payments received</span></div><div class="statbox"><b>${money(customerDue(rid))}</b><span>Outstanding</span></div></div><p><b>Phone:</b> ${esc(c.phone||'—')} &nbsp; <b>Reference:</b> ${esc(c.reference||'—')}</p><p><b>Address:</b> ${esc(c.address||'—')}</p><h4>Sales History</h4>${table(['Date','Invoice','Amount','Paid','Due'],sales.map(s=>tr([displayDate(s.date),esc(s.id),money(s.total),money(cPaid(s.id)),money(s.total-cPaid(s.id))])))}<h4 style="margin-top:15px">Payment History</h4>${table(['Date','Payment ID','Amount','Method'],pays.map(p=>tr([displayDate(p.date),esc(p.id),money(p.amount),esc(p.method)])))}<div class="form-actions"><button type="button" class="btn" id="cancelForm">Close</button></div>`,()=>{})}
function removeFinance(refs){db.finance=db.finance.filter(x=>!refs.includes(x.ref));}
function deleteRecord(type,rid){
 const arr=db[type],rec=arr?.find(x=>x.id===rid);if(!rec)return;
 let msg='Delete this record? Related entries will also be removed where applicable. This cannot be undone.';
 if(type==='purchases'&&stockNow()-Number(rec.oilcan||0)<-0.0001){toast('Cannot delete this purchase because some of its stock has already been sold.');return}
 if(type==='customers'&&db.sales.some(x=>x.customerId===rid)){toast('Cannot delete this customer because sales are linked to this account.');return}
 if(type==='customers'&&db.customerPayments.some(x=>x.customerId===rid)){toast('Cannot delete this customer because payment records are linked.');return}
 if(!confirm(msg))return;
 if(type==='purchases'){

function newCustomerPayment(prefill=''){formModal('Receive Customer Payment',`<div class="form-grid">${field('Payment Date','date','date',today(),'required')}${selectField('Customer','customer',opt(db.customers))}<div class="field"><label>Related Sale / Invoice</label><select name="sale" id="paymentSale"><option value="">Select sale...</option>${db.sales.map(s=>`<option value="${s.id}" ${s.id===prefill?'selected':''}>${esc(s.id)} — ${esc(nameOf(db.customers,s.customerId))} — Due ${money(s.total-cPaid(s.id))}</option>`).join('')}</select></div>${field('Payment Amount','amount','number','','min="0.01" step="0.01" required')}${selectField('Payment Method','method',['Cash','UPI','Bank Transfer','Other'].map(x=>`<option>${x}</option>`).join(''))}${field('Transaction Reference','reference')}${area('Notes','notes')}</div>`,d=>{let s=db.sales.find(x=>x.id===d.sale),amount=+d.amount;if(!s||s.customerId!==d.customer)throw Error('Select a sale belonging to this customer.');if(amount<=0||amount>s.total-cPaid(s.id)+.009)throw Error('Payment must be positive and cannot exceed the sale balance.');if(d.reference&&db.customerPayments.some(p=>p.reference===d.reference))throw Error('This transaction reference is already recorded.');let p={id:id('CPAY'),date:d.date,customerId:d.customer,saleId:s.id,amount,method:d.method,reference:d.reference,notes:d.notes};db.customerPayments.push(p);addFinance('in',amount,d.method,d.date,p.id,'Customer payment — '+nameOf(db.customers,d.customer));})}
function newVendor(){formModal('Add Vendor',`<div class="form-grid">${field('Vendor Name','name','text','','required')}${field('Contact Number','phone')}${field('Address','address')}${area('Notes','notes')}</div>`,d=>{if(!d.name.trim())throw Error('Vendor name is required.');if(db.vendors.some(v=>v.name.toLowerCase()===d.name.trim().toLowerCase()))throw Error('Vendor already exists.');db.vendors.push({id:id('VEN'),name:d.name.trim(),phone:d.phone,address:d.address,notes:d.notes})})}
function newVendorSale(){formModal('Vendor Oilcan Sale',`<div class="form-grid">${field('Date','date','date',today(),'required')}${selectField('Vendor','vendor',opt(db.vendors))}${field('Number of Oilcan','oilcan','number','1','min="1" step="1" required')}${field('Selling Amount per Oilcan','rate','number','0','min="0.01" step="0.01" required')}${field('Payment Received Now','paid','number','0','min="0" step="0.01"')}${selectField('Payment Method','method',['Cash','UPI','Bank Transfer','Other'].map(x=>`<option>${x}</option>`).join(''))}${area('Notes','notes')}</div><p class="hint">Fixed vendor profit: ₹50 per Oilcan. Each Oilcan deducts one Oilcan from inventory.</p>`,d=>{let q=+d.oilcan,total=q*+d.rate,paid=+d.paid,litres=q*15;if(!d.vendor||!d.date||q<1||!Number.isInteger(q)||+d.rate<=0||paid<0||paid>total)throw Error('Enter valid vendor, whole Oilcan quantity, rate and payment.');if(q>stockNow()+.0001)throw Error('Insufficient stock. Available: '+num(stockNow())+' Oilcan.');let s={id:id('VSA'),date:d.date,vendorId:d.vendor,oilcan:q,litres,rate:+d.rate,total,initialPaid:paid,method:d.method,notes:d.notes,created:Date.now()};db.vendorSales.push(s);db.stockMoves.push({id:id('STK'),date:s.date,type:'Vendor Sale',ref:s.id,in:0,out:q,balance:stockNow()-q,description:nameOf(db.vendors,s.vendorId)+' — '+q+' Oilcan',created:Date.now()});addFinance('in',paid,d.method,s.date,s.id,'Vendor sale payment')})}
function newVendorPayment(){formModal('Receive Vendor Payment',`<div class="form-grid">${field('Payment Date','date','date',today(),'required')}${selectField('Vendor','vendor',opt(db.vendors))}${field('Payment Amount','amount','number','','min="0.01" step="0.01" required')}${selectField('Payment Method','method',['Cash','UPI','Bank Transfer','Other'].map(x=>`<option>${x}</option>`).join(''))}${field('Transaction Reference','reference')}${area('Notes','notes')}</div>`,d=>{let amount=+d.amount;if(!d.vendor||amount<=0||amount>vendorDue(d.vendor)+.009)throw Error('Select a vendor and enter a payment not exceeding the outstanding balance.');if(d.reference&&db.vendorPayments.some(p=>p.reference===d.reference))throw Error('This transaction reference is already recorded.');let p={id:id('VPAY'),date:d.date,vendorId:d.vendor,amount,method:d.method,reference:d.reference,notes:d.notes};db.vendorPayments.push(p);addFinance('in',amount,d.method,d.date,p.id,'Vendor payment — '+nameOf(db.vendors,d.vendor))})}
function newSupplierPayment(){formModal('Pay Supplier',`<div class="form-grid">${field('Payment Date','date','date',today(),'required')}${selectField('Supplier','supplier',opt(db.suppliers))}<div class="field"><label>Purchase Bill</label><select name="purchase">${db.purchases.map(p=>`<option value="${p.id}">${esc(p.bill||p.id)} — ${esc(nameOf(db.suppliers,p.supplierId))} — Due ${money(p.total-supplierPaid(p.id))}</option>`).join('')}</select></div>${field('Payment Amount','amount','number','','min="0.01" step="0.01" required')}${selectField('Payment Method','method',['Cash','UPI','Bank Transfer','Other'].map(x=>`<option>${x}</option>`).join(''))}${field('Transaction Reference','reference')}</div>`,d=>{let p=db.purchases.find(x=>x.id===d.purchase),amount=+d.amount;if(!p||p.supplierId!==d.supplier)throw Error('Select a purchase belonging to this supplier.');if(amount<=0||amount>p.total-supplierPaid(p.id)+.009)throw Error('Payment exceeds supplier due.');let pay={id:id('SPAY'),date:d.date,supplierId:d.supplier,purchaseId:p.id,amount,method:d.method,reference:d.reference};db.supplierPayments.push(pay);addFinance('out',amount,d.method,d.date,pay.id,'Supplier payment — '+nameOf(db.suppliers,d.supplier))})}
function newExpense(){formModal('Add Expense',`<div class="form-grid">${field('Expense Date','date','date',today(),'required')}${selectField('Expense Category','category',['Transport','Loading / Unloading','Godown Expenses','Staff Expenses','Telephone','Other'].map(x=>`<option>${x}</option>`).join(''))}${field('Custom Category (optional)','custom')}${field('Amount','amount','number','','min="0.01" step="0.01" required')}${selectField('Payment Method','method',['Cash','UPI','Bank Transfer','Other'].map(x=>`<option>${x}</option>`).join(''))}${field('Description','description')}${area('Notes','notes')}</div>`,d=>{let amount=+d.amount;if(amount<=0||!d.date)throw Error('Enter a valid date and positive amount.');let x={id:id('EXP'),date:d.date,category:d.custom.trim()||d.category,description:d.description,amount,method:d.method,notes:d.notes};db.expenses.push(x);addFinance('out',amount,d.method,d.date,x.id,'Expense — '+x.category)})}
function stockAdjust(){formModal('Stock Adjustment',`<div class="form-grid">${field('Adjustment Date','date','date',today(),'required')}${selectField('Adjustment Type','direction','<option value="in">Add Stock</option><option value="out">Reduce Stock</option>')}${field('Quantity (Oilcan)','oilcan','number','','min="0.01" step="0.01" required')}${field('Reference (optional)','reference')}${area('Reason — required','reason')}</div>`,d=>{let q=+d.oilcan;if(q<=0||!d.reason.trim())throw Error('Positive Oilcan quantity and a reason are required.');if(d.direction==='out'&&q>stockNow())throw Error('Adjustment cannot make stock negative.');let m={id:id('STK'),date:d.date,type:'Adjustment',ref:d.reference||id('ADJ'),in:d.direction==='in'?q:0,out:d.direction==='out'?q:0,balance:stockNow()+(d.direction==='in'?q:-q),description:d.reason,created:Date.now()};db.stockMoves.push(m)})}
function bindSearches(){let el=$('#customerSearch');if(el)el.oninput=()=>{let pos=el.selectionStart;let html=customerBody();$('#content').querySelector('.toolbar').outerHTML=html.slice(0,html.indexOf('<div class="table-wrap"'));$('#content').querySelector('.table-wrap')?.remove();let tmp=document.createElement('div');tmp.innerHTML=html;let old=$('#content').querySelector('.toolbar');if(old)old.insertAdjacentHTML('afterend',tmp.querySelector('.table-wrap')?.outerHTML||'');bindCommon();bindActions()};}
function rowsFor(type){return db[type]||[]}
function exportCSV(type){let rows=rowsFor(type);if(type==='stockMoves')rows=db.stockMoves;downloadCSV(type,rows)}
function downloadCSV(name,rows){if(!rows||!rows.length){toast('No data available to export');return}let keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];let csv=[keys.join(','),...rows.map(r=>keys.map(k=>{let v=r[k]??'';if(typeof v==='object')v=JSON.stringify(v);return '"'+String(v).replace(/"/g,'""')+'"'}).join(','))].join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href)}
function backupDownload(){let blob=new Blob([JSON.stringify({...db,meta:{version:1,exportedAt:new Date().toISOString()}},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ShingTel_Backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')}
function restoreBackup(){let file=$('#restoreFile').files[0];if(!file){toast('Select a JSON backup file first');return}if(!confirm('Restore this backup? All current data in this browser will be overwritten.'))return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result),required=['customers','suppliers','vendors','purchases','sales','vendorSales','customerPayments','supplierPayments','vendorPayments','expenses','stockMoves','finance'];if(!x||!required.every(k=>Array.isArray(x[k])))throw Error('Invalid backup structure.');db={...blank(),...x,meta:{version:1}};save();render();toast('Backup restored successfully')}catch(e){toast('Restore failed: '+e.message)}};reader.readAsText(file)}
function runReport(){let type=$('#reportType').value,[a,b]=getRange(),rows=(db[type]||[]).filter(x=>within(x.date||'',a,b));window.lastReport={name:type,rows};let sums={sales:'total',purchases:'total',customerPayments:'amount',vendorSales:'total',expenses:'amount',finance:'amount',stockMoves:null};let total=sums[type]?sum(rows,x=>x[sums[type]]):0;let headings=rows.length?Object.keys(rows[0]):[];$('#reportResult').innerHTML=`<div class="summary-row"><b>${type.replace(/[A-Z]/g,m=>' '+m)} — ${displayDate(a)} to ${displayDate(b)}</b><b>${rows.length} records ${sums[type]?'/ '+money(total):''}</b></div>${table(headings,rows.map(r=>tr(headings.map(k=>esc(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])))))}`;bindCommon()}
function bindPageExtras(){bindActions();let cs=$('#customerSearch');if(cs)cs.oninput=()=>{let value=cs.value;render();let next=$('#customerSearch');if(next)next.value=value;bindPageExtras()};let s=$('#purchaseSearch');if(s)s.oninput=()=>{let q=s.value.toLowerCase();let rows=db.purchases.filter(p=>(p.bill+' '+nameOf(db.suppliers,p.supplierId)).toLowerCase().includes(q)).map(p=>tr([displayDate(p.date),esc(p.bill||'—'),esc(nameOf(db.suppliers,p.supplierId)),num(p.oilcan)+' Oilcan',money(p.total),money(supplierPaid(p.id)),money(p.total-supplierPaid(p.id))]));$('#purchaseTable').innerHTML=table(['Date','Bill No.','Supplier','Quantity','Total Amount','Paid','Remaining Due'],rows)};let ss=$('#salesSearch');if(ss)ss.oninput=()=>{let q=ss.value.toLowerCase();let rows=db.sales.filter(x=>(x.id+' '+nameOf(db.customers,x.customerId)).toLowerCase().includes(q)).map(s=>tr([displayDate(s.date),esc(s.id),esc(nameOf(db.customers,s.customerId)),s.product==='loose'?'Legacy Sale':'15-Litre Oilcan',num(s.qty),money(s.total),money(cPaid(s.id)),money(s.total-cPaid(s.id))]));let tw=$('#content .table-wrap');if(tw)tw.outerHTML=table(['Date','Invoice','Customer','Product','Quantity','Amount','Received','Due'],rows)}}
function bindNavigation(){$$('#nav button').forEach(b=>b.onclick=()=>{active=b.dataset.page;closeMobileNav();render();bindPageExtras()})}
function closeMobileNav(){$('#sidebar').classList.remove('open');$('#navShade').classList.remove('show')}
$('#menuBtn').onclick=()=>{let open=$('#sidebar').classList.toggle('open');$('#navShade').classList.toggle('show',open)};
$('#navShade').onclick=closeMobileNav;

function init(){
    if(localStorage.getItem('krushifalTheme')==='dark')document.body.classList.add('dark');
    let tb=$('#themeToggle');
    if(tb){
        const setThemeLabel=()=>tb.textContent=document.body.classList.contains('dark')?'☀️ Day':'🌙 Night';
        setThemeLabel();
        tb.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('krushifalTheme',document.body.classList.contains('dark')?'dark':'light');setThemeLabel()}
    } 
    $('#todayLabel').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
    bindNavigation();
    render();
    bindPageExtras();
    $('#content').addEventListener('click',e=>{
        let a=e.target.closest('[data-profile]');
        if(a){e.preventDefault();profile(a.dataset.profile,a.dataset.id)}
        let pay=e.target.closest('[data-pay-sale]');
        if(pay)newCustomerPayment(pay.dataset.paySale)
    }); 
}

async function startApp() {
    db = await load();
    init();
}
startApp();
</script>
</body>
